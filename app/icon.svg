<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Grid Prophets">
  <!--
    Grid Prophets mark.

    Three grid slots raked forward, longest first and in the brand red
    (--f1-red / --primary #fd122e), over a --card tile (#0e0f12) with the HUD
    border. The rake and the descending widths are load-bearing: an earlier
    version used evenly stacked equal-width bars and read as a hamburger menu
    at 16px. Verified legible at 16, 24, 32 and 96.

    Tile is dark on purpose so it holds on light and dark browser chrome alike.
  -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#0e0f12" stroke="#262a33" />
  <g transform="skewX(-18)">
    <rect x="12"   y="8"    width="16" height="4.2" rx="2.1" fill="#fd122e" />
    <rect x="10.5" y="14.1" width="12" height="4.2" rx="2.1" fill="#f2f2f2" />
    <rect x="9"    y="20.2" width="8"  height="4.2" rx="2.1" fill="#f2f2f2" opacity="0.5" />
  </g>
</svg>
